# 50 — Programs started with the session (a change needs a restart)
#
# iNiR itself is not here: inir.service starts it with umbriel.service (`inir service enable` wires it), so a crash
# restarts the shell and logging out stops it. Adding it here too would give you two shells.

# ── Startup Audio & J.A.R.V.I.S. Welcome Notification ─────────────────────────
[general]
autostart = [
  "sh -c 'pgrep -x qs >/dev/null || qs -c inir'",
  "sh -c 'command -v awww-daemon >/dev/null && (pgrep -x awww-daemon >/dev/null || awww-daemon) || swaybg -c \"#0d0a1a\"'",
  "sh -c 'pgrep -x xwayland-satellite >/dev/null || $HOME/.cargo/bin/xwayland-satellite'",
  "sh -c \"sound-system startup && notify-send 'J.A.R.V.I.S.' 'Systems online. Welcome back, Matthew.' -i audio-speakers\"",
  "sh -c 'sleep 2 && fcitx5 -D'",
  "otd-daemon",
  "env XDG_MENU_PREFIX=plasma- kbuildsycoca6",
  "gnome-keyring-daemon --start --components=secrets,ssh",
  "gamemoded &",
  "openrgb --profile default --server &",
  # ───"wl-mirror DP-1",
  # ─── Security Authentication Layer (Void KDE Polkit Agent) ───
  "sh -c 'if [ -x /usr/libexec/polkit-kde-authentication-agent-1 ]; then exec /usr/libexec/polkit-kde-authentication-agent-1; elif [ -x /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 ]; then exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1; fi'",

  # Clipboard history
  "wl-paste --no-newline --type text --watch ~/.config/quickshell/inir/scripts/lib/accel-run clipboard-store",
  "wl-paste --type image --watch ~/.config/quickshell/inir/scripts/clipboard-image-store.sh",
  # >>> inir-managed-autostart >>>
  # Managed by iNiR Settings — add or remove entries via Settings › Autostart.
  # <<< inir-managed-autostart <<<
]
